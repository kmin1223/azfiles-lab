<svg viewBox="0 0 1400 940" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Calibri, Arial, sans-serif" role="img">
  <title>Azure Files identity authentication — 60-second triage flowchart</title>
  <desc>A two-lane decision tree: AD DS (Session 1) and Entra Kerberos (Session 2), starting from a failed mount, branching by first diagnostic command to a likely cause and fix.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1E2761"/>
    </marker>
    <style>
      .h  { font-size:15px; font-weight:700; fill:#1E2761; }
      .b  { font-size:13px; fill:#202440; }
      .bw { font-size:13px; fill:#FFFFFF; font-weight:700; }
      .m  { font-size:12px; font-family:"Courier New",monospace; fill:#1E2761; }
      .mw { font-size:12px; font-family:"Courier New",monospace; fill:#FFFFFF; }
      .lbl{ font-size:12px; font-weight:700; fill:#5A5A6E; }
      .cap{ font-size:12px; fill:#5A5A6E; }
    </style>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1400" height="940" fill="#FFFFFF"/>

  <!-- title -->
  <text x="40" y="46" font-size="26" font-weight="700" fill="#1E2761">Azure Files identity auth — the 60-second triage</text>
  <text x="40" y="72" class="cap">Start at a failed mount. Ask the questions in order; the first command that returns "no" points to the cause.</text>

  <!-- ===== SHARED TOP ===== -->
  <!-- start -->
  <rect x="560" y="92" width="280" height="52" rx="10" fill="#1E2761"/>
  <text x="700" y="116" text-anchor="middle" class="bw">Mount fails / Access denied</text>
  <text x="700" y="134" text-anchor="middle" class="mw">net use Z: \\&lt;sa&gt;…\share</text>

  <!-- Q1 network -->
  <rect x="560" y="176" width="280" height="60" rx="10" fill="#FDF4E0" stroke="#F2C14E" stroke-width="1.5"/>
  <text x="700" y="200" text-anchor="middle" class="lbl">Q1 · LAYER = NETWORK?</text>
  <text x="700" y="222" text-anchor="middle" class="m">Test-NetConnection &lt;sa&gt;… -Port 445</text>
  <line x1="700" y1="144" x2="700" y2="176" stroke="#1E2761" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- network fail box (right) -->
  <rect x="900" y="170" width="380" height="72" rx="10" fill="#FDECEC" stroke="#F96167" stroke-width="1.5"/>
  <text x="918" y="192" class="h">✗ Network</text>
  <text x="918" y="212" class="b">Error 53/67/timeout = 445 blocked (ISP/firewall/NSG) or DNS.</text>
  <text x="918" y="230" class="b">Error 64 = proxy/NAT drops the handshake.  Fix: open 445 · PE · VPN.</text>
  <line x1="840" y1="206" x2="900" y2="206" stroke="#F96167" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="852" y="199" class="lbl">NO</text>

  <!-- YES down to split -->
  <line x1="700" y1="236" x2="700" y2="270" stroke="#1E2761" stroke-width="1.5"/>
  <text x="712" y="258" class="lbl">YES → which auth type?</text>
  <!-- split horizontal -->
  <line x1="350" y1="270" x2="1050" y2="270" stroke="#1E2761" stroke-width="1.5"/>
  <line x1="350" y1="270" x2="350" y2="300" stroke="#1E2761" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1050" y1="270" x2="1050" y2="300" stroke="#1E2761" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== LANE A: AD DS ===== -->
  <rect x="40" y="300" width="620" height="600" rx="14" fill="#F3F6FD"/>
  <text x="60" y="330" font-size="18" font-weight="700" fill="#1E2761">Session 1 · On-prem AD DS</text>
  <text x="60" y="350" class="cap">The DC issues the tickets. Walk AS → TGS → AP.</text>

  <!-- A: klist get ticket? -->
  <rect x="190" y="366" width="320" height="60" rx="10" fill="#FFFFFF" stroke="#1E2761" stroke-width="1.3"/>
  <text x="350" y="390" text-anchor="middle" class="lbl">Q2 · STAGE — ticket issued?</text>
  <text x="350" y="412" text-anchor="middle" class="m">klist get cifs/&lt;sa&gt;.file.core.windows.net</text>
  <line x1="350" y1="300" x2="350" y2="366" stroke="#1E2761" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- A-NO: TGS failures (narrowed left) -->
  <rect x="55" y="470" width="410" height="120" rx="10" fill="#FDECEC" stroke="#F96167" stroke-width="1.5"/>
  <text x="72" y="492" class="h">✗ TGS stage — no ticket</text>
  <text x="72" y="513" class="b">• 0xc000018b / PRINCIPAL_UNKNOWN</text>
  <text x="72" y="530" class="b">   → SPN missing/wrong.</text>
  <text x="72" y="548" class="m">   setspn -Q cifs/&lt;sa&gt;…  → fix SPN</text>
  <text x="72" y="568" class="b">• "encryption type not supported"</text>
  <text x="72" y="584" class="b">   → etype mismatch; enable AES-256.</text>
  <line x1="300" y1="426" x2="230" y2="470" stroke="#F96167" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="205" y="452" class="lbl">NO</text>

  <!-- A-YES spine (clear channel at x=500) -->
  <line x1="430" y1="426" x2="500" y2="470" stroke="#1E2761" stroke-width="1.5"/>
  <line x1="500" y1="470" x2="500" y2="606" stroke="#1E2761" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="510" y="452" class="lbl">YES</text>

  <!-- A: 1396 -->
  <rect x="60" y="606" width="580" height="86" rx="10" fill="#FDECEC" stroke="#F96167" stroke-width="1.5"/>
  <text x="78" y="628" class="h">✗ AP stage — mount fails 1396</text>
  <text x="78" y="649" class="b">Ticket is valid but the file service can't decrypt it:</text>
  <text x="78" y="666" class="b">kerb key ≠ AD object password (KRB_AP_ERR_MODIFIED).</text>
  <text x="78" y="684" class="m">    Update-AzStorageAccountADObjectPassword -RotateToKerbKey</text>

  <!-- A: access denied authz -->
  <rect x="60" y="710" width="580" height="80" rx="10" fill="#FDF4E0" stroke="#F2C14E" stroke-width="1.5"/>
  <text x="78" y="732" class="h">⚠ Authorization — denied with a valid ticket</text>
  <text x="78" y="753" class="b">Effective access = the more restrictive of RBAC and NTFS.</text>
  <text x="78" y="771" class="m">    check role assignment (share) + icacls (NTFS)</text>

  <text x="512" y="600" class="cap">error 1396</text>
  <line x1="350" y1="692" x2="350" y2="710" stroke="#1E2761" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="705" class="cap">or: access denied</text>

  <!-- ===== LANE B: Entra Kerberos ===== -->
  <rect x="740" y="300" width="620" height="600" rx="14" fill="#F3F6FD"/>
  <text x="760" y="330" font-size="18" font-weight="700" fill="#1E2761">Session 2 · Entra Kerberos</text>
  <text x="760" y="350" class="cap">Entra issues a cloud TGT. Walk the chain left → right.</text>

  <!-- B: dsregcmd joined? -->
  <rect x="890" y="366" width="320" height="60" rx="10" fill="#FFFFFF" stroke="#1E2761" stroke-width="1.3"/>
  <text x="1050" y="390" text-anchor="middle" class="lbl">Q2 · device hybrid joined?</text>
  <text x="1050" y="412" text-anchor="middle" class="m">dsregcmd /status → AzureAdJoined</text>
  <line x1="1050" y1="300" x2="1050" y2="366" stroke="#1E2761" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- B-NO: not joined (narrowed left, clear YES channel on the right) -->
  <rect x="760" y="464" width="330" height="72" rx="10" fill="#FDECEC" stroke="#F96167" stroke-width="1.5"/>
  <text x="778" y="486" class="h">✗ Device link — NO</text>
  <text x="778" y="507" class="b">AzureAdJoined: NO → no PRT →</text>
  <text x="778" y="524" class="b">no cloud TGT. Re-register the device.</text>
  <line x1="1000" y1="426" x2="930" y2="464" stroke="#F96167" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="905" y="452" class="lbl">NO</text>

  <!-- B-YES: cloud TGT? -->
  <rect x="890" y="556" width="320" height="60" rx="10" fill="#FFFFFF" stroke="#1E2761" stroke-width="1.3"/>
  <text x="1050" y="580" text-anchor="middle" class="lbl">Q3 · cloud TGT present?</text>
  <text x="1050" y="602" text-anchor="middle" class="m">klist cloud_debug</text>
  <line x1="1160" y1="426" x2="1160" y2="586" stroke="#1E2761" stroke-width="1.5"/>
  <line x1="1160" y1="586" x2="1210" y2="586" stroke="#1E2761" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1168" y="500" class="lbl">YES</text>

  <!-- B-NO cloud tgt (narrowed left) -->
  <rect x="760" y="650" width="330" height="72" rx="10" fill="#FDECEC" stroke="#F96167" stroke-width="1.5"/>
  <text x="778" y="672" class="h">✗ Cloud TGT — none</text>
  <text x="778" y="692" class="b">System error 1327. Fix:</text>
  <text x="778" y="710" class="m">CloudKerberos…Enabled=1 + re-logon</text>
  <line x1="980" y1="616" x2="930" y2="650" stroke="#F96167" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="905" y="640" class="lbl">NO</text>

  <!-- B-YES denied (terminal, full width) -->
  <rect x="760" y="742" width="580" height="86" rx="10" fill="#FDF4E0" stroke="#F2C14E" stroke-width="1.5"/>
  <text x="778" y="764" class="h">⚠ Ticket path OK but denied</text>
  <text x="778" y="785" class="b">• Admin consent removed from the [Storage Account] app → re-grant.</text>
  <text x="778" y="803" class="b">• CA policy forces MFA on the app → exclude the app.</text>
  <text x="778" y="821" class="b">• User is cloud-only (not hybrid) → sync from AD.</text>
  <line x1="1160" y1="616" x2="1160" y2="742" stroke="#1E2761" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1168" y="695" class="lbl">YES</text>

  <!-- ===== FOOTER ===== -->
  <rect x="40" y="882" width="1320" height="0.8" fill="#CADCFC"/>
  <text x="40" y="918" class="b"><tspan font-weight="700" fill="#1E2761">Trace tool: </tspan>AD DS → netsh / Wireshark (UDP-TCP 88).   Entra Kerberos → Fiddler + Kerberos.NET (KDC proxy over HTTPS; Wireshark can't read it).   <tspan font-weight="700" fill="#1E2761">One command for AD DS: </tspan>Debug-AzStorageAccountAuth.</text>
</svg>
